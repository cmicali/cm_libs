name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pieces:
    runs-on: macos-26
    # Builds, tests, and analyzes every piece in one job. The limit grows with the piece count.
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/setup-xcodegen

      - name: Check the piece rules
        run: make check-pieces

      - name: Test every piece on macOS
        id: test
        run: make test

      # make test passes -quiet, so the step above names a failing test and
      # nothing more. A failed xcodebuild also stops make before its summary.
      - name: Print the failing tests' messages
        if: failure() && steps.test.outcome == 'failure'
        run: python3 -I scripts/checks/test-summary.py build/TestResults.xcresult

      - name: Upload the result bundle
        if: failure() && steps.test.outcome == 'failure'
        uses: actions/upload-artifact@v7
        with:
          name: TestResults.xcresult
          path: build/TestResults.xcresult
          retention-days: 7
          if-no-files-found: ignore

      - name: Build every piece for iOS
        run: make build-ios

      - name: Build and run a minimal consumer
        run: make consumer

      - name: Analyze every piece
        run: make analyze
