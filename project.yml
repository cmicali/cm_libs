  VorbisTests:
    type: bundle.unit-test
    platform: macOS
    templates: [VibeLibsVorbis]
    sources:
      - path: Tests/third_party/vorbis
        excludes: ["**/*.md"]
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES

  Vorbis-iOS:
    type: library.static
    platform: iOS
    templates: [VibeLibsVorbis]

schemes:
  vibe-libs:
    build:
      targets:
        CommonTests: [test]
        Common-iOS: all
        GraphicsTests: [test]
        Graphics-iOS: all
        DSPTests: [test]
        DSP-iOS: all
        ControlsTests: [test]
        SettingsWindowTests: [test]
        TaglibTests: [test]
        Taglib-iOS: all
        PINCacheTests: [test]
        PINCache-iOS: all
        PINOperationTests: [test]
        PINOperation-iOS: all
        R8brainTests: [test]
        R8brain-iOS: all
        DrMp3Tests: [test]
        DrMp3-iOS: all
        DrFlacTests: [test]
        DrFlac-iOS: all
        DrWavTests: [test]
        DrWav-iOS: all
        OggTests: [test]
        Ogg-iOS: all
        VorbisTests: [test]
        Vorbis-iOS: all
    test:
      targets: [CommonTests, GraphicsTests, DSPTests, ControlsTests, SettingsWindowTests, TaglibTests,
                PINCacheTests, PINOperationTests, R8brainTests, DrMp3Tests, DrFlacTests, DrWavTests,
                OggTests, VorbisTests]
