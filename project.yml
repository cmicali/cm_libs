# This repo's own project. It builds and tests each piece alone, with the
# headermap off and no prefix header, so an import outside a piece's declared
# dependencies fails here even when an app's headermap would resolve it.
# Generated by XcodeGen (`make project`) and not checked in.

name: vibe-libs

include:
  - path: vibe-libs.yml

options:
  bundleIdPrefix: com.commonwealthrecordings.vibelibs
  deploymentTarget:
    macOS: "13.0"
    iOS: "26.0"

settings:
  base:
    VIBE_LIBS_ROOT: "$(SRCROOT)"
    USE_HEADERMAP: NO
    ALWAYS_SEARCH_USER_PATHS: NO
    GCC_PREFIX_HEADER: ""
    CLANG_ENABLE_OBJC_ARC: YES
    GCC_C_LANGUAGE_STANDARD: c17
    CLANG_CXX_LANGUAGE_STANDARD: "c++17"
    GCC_TREAT_WARNINGS_AS_ERRORS: YES
    CLANG_WARN_UNGUARDED_AVAILABILITY: YES_AGGRESSIVE
    CODE_SIGNING_ALLOWED: NO

# Each piece has a macOS test bundle over Tests/<piece> and a <piece>-iOS
# static library, both listing its template. A macOS-only piece, marked in the
# plan's map, has the test bundle alone: no <piece>-iOS target, and no iOS
# target lists its template, directly or through another template.
targets:
  # core/Common is only headers. Its tests compile them alone.
  CommonTests:
    type: bundle.unit-test
    platform: macOS
    templates: [VibeLibsCommon]
    templateAttributes:
      excludedPlatform: iOS
    sources:
      - path: Tests/core/Common
        excludes: ["**/*.md"]
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES

  # core/Common built for iOS, through its probe.
  Common-iOS:
    type: library.static
    platform: iOS
    templates: [VibeLibsCommon]
    templateAttributes:
      excludedPlatform: Mac
    sources:
      - path: Tests/core/Common/CommonProbe.m

  # core/Graphics, tested on macOS. Its tests are the Mac half's.
  GraphicsTests:
    type: bundle.unit-test
    platform: macOS
    templates: [VibeLibsGraphics]
    templateAttributes:
      excludedPlatform: iOS
    sources:
      - path: Tests/core/Graphics
        excludes: ["**/*.md"]
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES

  # core/Graphics built for iOS: its shared files and its iOS half.
  Graphics-iOS:
    type: library.static
    platform: iOS
    templates: [VibeLibsGraphics]
    templateAttributes:
      excludedPlatform: Mac

  # audio/DSP, tested on macOS. The tests' hang bound matches Vibe's.
  DSPTests:
    type: bundle.unit-test
    platform: macOS
    templates: [VibeLibsDSP]
    templateAttributes:
      excludedPlatform: iOS
    sources:
      - path: Tests/audio/DSP
        excludes: ["**/*.md"]
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        GCC_PREPROCESSOR_DEFINITIONS: ["$(inherited)", "VIBE_TEST_HANG_TIMEOUT=10"]

  # audio/DSP built for iOS, so an AppKit leak fails here.
  DSP-iOS:
    type: library.static
    platform: iOS
    templates: [VibeLibsDSP]
    templateAttributes:
      excludedPlatform: Mac

  # ui/Controls, tested on macOS. It is macOS only, so it has no iOS target.
  # Its tests draw through the shared drawn-view support in Tests/Support.
  ControlsTests:
    type: bundle.unit-test
    platform: macOS
    templates: [VibeLibsControls]
    templateAttributes:
      excludedPlatform: iOS
    sources:
      - path: Tests/ui/Controls
        excludes: ["**/*.md"]
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        HEADER_SEARCH_PATHS: ["$(inherited)", "$(SRCROOT)/Tests/Support"]

  # ui/SettingsWindow, tested on macOS. It is macOS only, so it has no iOS
  # target. Its tests share the drawn-view support with Controls'.
  SettingsWindowTests:
    type: bundle.unit-test
    platform: macOS
    templates: [VibeLibsSettingsWindow]
    templateAttributes:
      excludedPlatform: iOS
    sources:
      - path: Tests/ui/SettingsWindow
        excludes: ["**/*.md"]
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        HEADER_SEARCH_PATHS: ["$(inherited)", "$(SRCROOT)/Tests/Support"]

  # third_party/: each library's tests build it alone and call into it once,
  # so a missing file or a broken link fails here. Each iOS target builds the
  # library for the simulator. None of them excludes a platform half.
  TaglibTests:
    type: bundle.unit-test
    platform: macOS
    templates: [VibeLibsTaglib]
    sources:
      - path: Tests/third_party/taglib
        excludes: ["**/*.md"]
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES

  Taglib-iOS:
    type: library.static
    platform: iOS
    templates: [VibeLibsTaglib]

  PINCacheTests:
    type: bundle.unit-test
    platform: macOS
    templates: [VibeLibsPINCache]
    sources:
      - path: Tests/third_party/PINCache
        excludes: ["**/*.md"]
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES

  PINCache-iOS:
    type: library.static
    platform: iOS
    templates: [VibeLibsPINCache]

  PINOperationTests:
    type: bundle.unit-test
    platform: macOS
    templates: [VibeLibsPINOperation]
    sources:
      - path: Tests/third_party/PINOperation
        excludes: ["**/*.md"]
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES

  PINOperation-iOS:
    type: library.static
    platform: iOS
    templates: [VibeLibsPINOperation]

  R8brainTests:
    type: bundle.unit-test
    platform: macOS
    templates: [VibeLibsR8brain]
    sources:
      - path: Tests/third_party/r8brain
        excludes: ["**/*.md"]
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES

  R8brain-iOS:
    type: library.static
    platform: iOS
    templates: [VibeLibsR8brain]

  DrMp3Tests:
    type: bundle.unit-test
    platform: macOS
    templates: [VibeLibsDrMp3]
    sources:
      - path: Tests/third_party/dr_mp3
        excludes: ["**/*.md"]
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES

  DrMp3-iOS:
    type: library.static
    platform: iOS
    templates: [VibeLibsDrMp3]

  DrFlacTests:
    type: bundle.unit-test
    platform: macOS
    templates: [VibeLibsDrFlac]
    sources:
      - path: Tests/third_party/dr_flac
        excludes: ["**/*.md"]
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES

  DrFlac-iOS:
    type: library.static
    platform: iOS
    templates: [VibeLibsDrFlac]

  DrWavTests:
    type: bundle.unit-test
    platform: macOS
    templates: [VibeLibsDrWav]
    sources:
      - path: Tests/third_party/dr_wav
        excludes: ["**/*.md"]
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES

  DrWav-iOS:
    type: library.static
