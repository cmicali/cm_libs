# This repo's own project. It builds and tests each piece alone, with the
# headermap off and no prefix header, so an import outside a piece's declared
# dependencies fails here even when an app's headermap would resolve it.
# Generated by XcodeGen (`make project`) and not checked in.

name: cm_libs

include:
  - path: cm_libs.yml

options:
  bundleIdPrefix: com.commonwealthrecordings.cmlibs
  deploymentTarget:
    macOS: "13.0"
    iOS: "26.0"

settings:
  base:
    CMM_ROOT: "$(SRCROOT)"
    USE_HEADERMAP: NO
    ALWAYS_SEARCH_USER_PATHS: NO
    GCC_PREFIX_HEADER: ""
    CLANG_ENABLE_OBJC_ARC: YES
    GCC_C_LANGUAGE_STANDARD: c17
    CLANG_CXX_LANGUAGE_STANDARD: "c++17"
    GCC_TREAT_WARNINGS_AS_ERRORS: YES
    CLANG_WARN_UNGUARDED_AVAILABILITY: YES_AGGRESSIVE
    CODE_SIGNING_ALLOWED: NO

targets:
  # audio/DSP, tested on macOS. The tests' hang bound matches Vibe's.
  DSPTests:
    type: bundle.unit-test
    platform: macOS
    templates: [CMMDSP]
    templateAttributes:
      excludedPlatform: iOS
    sources:
      - path: Tests/audio/DSP
        excludes: ["**/*.md"]
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        GCC_PREPROCESSOR_DEFINITIONS: ["$(inherited)", "VIBE_TEST_HANG_TIMEOUT=10"]

  # audio/DSP built for iOS, so an AppKit leak fails here.
  DSP-iOS:
    type: library.static
    platform: iOS
    templates: [CMMDSP]
    templateAttributes:
      excludedPlatform: Mac

schemes:
  cm_libs:
    build:
      targets:
        DSPTests: [test]
        DSP-iOS: all
    test:
      targets: [DSPTests]
