# This repo's own project. It builds and tests each piece alone, with the
# headermap off and no prefix header, so an import outside a piece's declared
# dependencies fails here even when an app's headermap would resolve it.
# Generated by XcodeGen (`make project`) and not checked in.

name: vibe-libs

include:
  - path: vibe-libs.yml

options:
  bundleIdPrefix: com.commonwealthrecordings.vibelibs
  deploymentTarget:
    macOS: "13.0"
    iOS: "26.0"

settings:
  base:
    VIBE_LIBS_ROOT: "$(SRCROOT)"
    USE_HEADERMAP: NO
    ALWAYS_SEARCH_USER_PATHS: NO
    GCC_PREFIX_HEADER: ""
    CLANG_ENABLE_OBJC_ARC: YES
    GCC_C_LANGUAGE_STANDARD: c17
    CLANG_CXX_LANGUAGE_STANDARD: "c++17"
    GCC_TREAT_WARNINGS_AS_ERRORS: YES
    CLANG_WARN_UNGUARDED_AVAILABILITY: YES_AGGRESSIVE
    CODE_SIGNING_ALLOWED: NO

# Each piece has a macOS test bundle over Tests/<piece> and a <piece>-iOS
# static library, both listing its template. A macOS-only piece, marked in the
# plan's map, has the test bundle alone: no <piece>-iOS target, and no iOS
# target lists its template, directly or through another template.
targets:
  # core/Common is only headers. Its tests compile them alone.
  CommonTests:
    type: bundle.unit-test
    platform: macOS
    templates: [VibeLibsCommon]
    templateAttributes:
      excludedPlatform: iOS
    sources:
      - path: Tests/core/Common
        excludes: ["**/*.md"]
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES

  # core/Common built for iOS, through its probe.
  Common-iOS:
    type: library.static
    platform: iOS
    templates: [VibeLibsCommon]
    templateAttributes:
      excludedPlatform: Mac
    sources:
      - path: Tests/core/Common/CommonProbe.m

  # core/Graphics, tested on macOS. Its tests are the Mac half's.
  GraphicsTests:
    type: bundle.unit-test
    platform: macOS
    templates: [VibeLibsGraphics]
    templateAttributes:
      excludedPlatform: iOS
    sources:
      - path: Tests/core/Graphics
        excludes: ["**/*.md"]
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES

  # core/Graphics built for iOS: its shared files and its iOS half.
  Graphics-iOS:
    type: library.static
    platform: iOS
    templates: [VibeLibsGraphics]
    templateAttributes:
      excludedPlatform: Mac

  # audio/DSP, tested on macOS. The tests' hang bound matches Vibe's.
  DSPTests:
    type: bundle.unit-test
    platform: macOS
    templates: [VibeLibsDSP]
    templateAttributes:
      excludedPlatform: iOS
    sources:
      - path: Tests/audio/DSP
        excludes: ["**/*.md"]
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        GCC_PREPROCESSOR_DEFINITIONS: ["$(inherited)", "VIBE_TEST_HANG_TIMEOUT=10"]

  # audio/DSP built for iOS, so an AppKit leak fails here.
  DSP-iOS:
    type: library.static
    platform: iOS
    templates: [VibeLibsDSP]
    templateAttributes:
      excludedPlatform: Mac

schemes:
  vibe-libs:
    build:
      targets:
        CommonTests: [test]
        Common-iOS: all
        GraphicsTests: [test]
        Graphics-iOS: all
        DSPTests: [test]
        DSP-iOS: all
    test:
      targets: [CommonTests, GraphicsTests, DSPTests]
