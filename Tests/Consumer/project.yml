# A minimal app of its own, outside this repo's project. It includes the
# shared spec from another directory, as an app's submodule does, and builds
# with no prefix header and no headermap. `make consumer` builds and runs it.

name: Consumer

include:
  - path: ../../vibe-libs.yml

options:
  deploymentTarget:
    macOS: "13.0"

settings:
  base:
    VIBE_LIBS_ROOT: "$(SRCROOT)/../.."
    USE_HEADERMAP: NO
    ALWAYS_SEARCH_USER_PATHS: NO
    GCC_PREFIX_HEADER: ""
    CLANG_ENABLE_OBJC_ARC: YES
    # As Vibe and this repo's project build. Under a GNU dialect, Graphics'
    # constant-sized arrays warn as a GNU extension, and warnings are errors.
    GCC_C_LANGUAGE_STANDARD: c17
    GCC_TREAT_WARNINGS_AS_ERRORS: YES
    CLANG_WARN_UNGUARDED_AVAILABILITY: YES_AGGRESSIVE
    CODE_SIGNING_ALLOWED: NO

targets:
  Consumer:
    type: tool
    platform: macOS
    templates: [VibeLibsAudioTypes, VibeLibsDSP, VibeLibsAnalysis, VibeLibsOutputDevices, VibeLibsFX,
                VibeLibsMeter, VibeLibsFileLoading, VibeLibsDecode, VibeLibsDiskCache, VibeLibsGraphics,
                VibeLibsPlayQueue, VibeLibsPlaylists, VibeLibsControls, VibeLibsSettingsWindow,
                VibeLibsShortcuts]
    templateAttributes:
      excludedPlatform: iOS
    sources:
      - path: main.m
    scheme: {}
